services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kindredkinks
      POSTGRES_PASSWORD: kindredkinks
      POSTGRES_DB: kindredkinks
    volumes:
      - kindredkinks_pg:/var/lib/postgresql/data

volumes:
  kindredkinks_pg:
