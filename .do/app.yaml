# DigitalOcean App Platform spec.
# Create the managed Postgres cluster "openheart-db" first, then:
#   doctl apps create --spec .do/app.yaml
# Secrets marked type: SECRET are set in the App Platform dashboard, never committed.
name: openheart-dating
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: openheart-db

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Dark0tter/OpenHeart-Dating
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npx prisma generate
    run_command: npm run db:setup
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

services:
  - name: web
    github:
      repo: Dark0tter/OpenHeart-Dating
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: AUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: AUTH_TRUST_HOST
        scope: RUN_TIME
        value: "true"
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: APP_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        scope: RUN_TIME
      - key: TURNSTILE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        scope: BUILD_TIME
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_SENTRY_DSN
        scope: BUILD_TIME
      - key: VERIFICATION_PROVIDER
        scope: RUN_TIME
        value: persona
      - key: ALLOW_VERIFICATION_STUB
        scope: RUN_TIME
        value: "false"
      # Persona hosted age verification; webhook URL: ${APP_URL}/api/verification/persona-webhook
      - key: PERSONA_TEMPLATE_ID
        scope: RUN_TIME
      - key: PERSONA_ENVIRONMENT_ID
        scope: RUN_TIME
      - key: PERSONA_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PERSONA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      # Public safety / child-safety contact shown on /terms and /child-safety.
      - key: SUPPORT_EMAIL
        scope: RUN_AND_BUILD_TIME
      # Photo storage (DigitalOcean Spaces): S3_ENDPOINT e.g. https://nyc3.digitaloceanspaces.com
      - key: S3_BUCKET
        scope: RUN_TIME
      - key: S3_REGION
        scope: RUN_TIME
      - key: S3_ENDPOINT
        scope: RUN_TIME
      - key: S3_KEY
        scope: RUN_TIME
        type: SECRET
      - key: S3_SECRET
        scope: RUN_TIME
        type: SECRET
      # "pre" = photos hidden until a moderator approves them.
      - key: PHOTO_REVIEW_MODE
        scope: RUN_TIME
        value: pre
      - key: IMAGE_SCAN_URL
        scope: RUN_TIME
      - key: IMAGE_SCAN_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Web push. Generate once with `npm run vapid:generate`.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        scope: RUN_AND_BUILD_TIME
      - key: VAPID_PRIVATE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VAPID_SUBJECT
        scope: RUN_TIME
      # Only needed if DATABASE_URL goes through a transaction-mode pooler.
      - key: REALTIME_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      # Background jobs run inside the web service; protects the optional /api/cron trigger.
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET
      # Hour (UTC) of the daily moderation summary email; 13 = 9am US Eastern.
      - key: STAFF_DIGEST_HOUR_UTC
        scope: RUN_TIME
        value: "13"
      - key: GEOCODING
        scope: RUN_TIME
        value: "on"
