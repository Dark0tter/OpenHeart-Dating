<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kindred Kinks — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3ebe3;
        color: #1a2420;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111815;
          color: #e6ede8;
        }
      }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 16px;
        background: #2d4a3e;
        color: #faf6f1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-weight: 500">You're offline</h1>
      <p>Kindred Kinks needs a connection. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
